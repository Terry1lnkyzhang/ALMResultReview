[skill]
id = "equipment-role"
name = "Equipment Role Review"
version = "1.4.2"
stage = "equipment_review"
enabled = true

[contract]
version = "1"
input_collection = "steps"
output_collection = "decisions"
identity_field = "review_step"

[capabilities]
required = ["review.step_text", "equipment.registry.candidates", "equipment.registry.names"]
optional = ["equipment.previous_matches"]
forbidden = ["filesystem.read", "network.fetch", "evidence.image.content", "equipment.registry.write"]

[model]
enable_thinking = false
# Thinking tokens count against max_tokens.
max_tokens = 8192
max_tokens_per_item = 1024
