[skill]
id = "html-evidence-review"
name = "HTML Evidence Review"
version = "1.6.0"
stage = "report_review"
enabled = true

[contract]
version = "1"
input_collection = "steps"
output_collection = "assessments"
identity_field = "review_step"

[capabilities]
required = ["review.step_text", "evidence.html.metadata", "evidence.html.content", "evidence.automation_release.metadata"]
optional = []
forbidden = ["filesystem.read", "network.fetch", "evidence.image.content", "equipment.registry", "database.read", "verdict.write"]

[model]
temperature = 0
max_tokens = 32768
max_tokens_per_item = 1024