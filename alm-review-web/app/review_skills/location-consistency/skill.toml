[skill]
id = "location-consistency"
name = "Test Location Consistency Review"
version = "1.0.1"
stage = "location_review"
enabled = true

[contract]
version = "1"
input_collection = ""
output_collection = ""
identity_field = ""

[capabilities]
required = ["review.location.parent_name", "location.configuration.metadata"]
